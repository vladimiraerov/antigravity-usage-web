<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Antigravity Usage Monitor for Web Portal">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111c36"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="22%" cy="35%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="82%" cy="68%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="gaugeArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Outer rounded card -->
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#bg)" stroke="#334155" stroke-opacity="0.65" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#grid)"/>
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#glowCyan)"/>
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#glowEmerald)"/>

  <!-- Left Gauge Emblem -->
  <g transform="translate(135, 160)">
    <circle cx="0" cy="0" r="68" fill="#0b1224" stroke="#1e293b" stroke-width="2"/>
    <!-- Track arc (270 deg) -->
    <path d="M -38.2 38.2 A 54 54 0 1 1 38.2 38.2" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <!-- Filled progress arc (~82%) -->
    <path d="M -38.2 38.2 A 54 54 0 1 1 52.8 -11.2" fill="none" stroke="url(#gaugeArc)" stroke-width="12" stroke-linecap="round"/>
    <!-- Center readout -->
    <text x="0" y="-2" text-anchor="middle" fill="#f8fafc" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">84%</text>
    <text x="0" y="18" text-anchor="middle" fill="#34d399" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">LIVE</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(245, 92)">
    <!-- Pill Eyebrow -->
    <rect x="0" y="0" width="268" height="28" rx="14" fill="#0f293a" stroke="#38bdf8" stroke-opacity="0.38" stroke-width="1"/>
    <circle cx="16" cy="14" r="4.5" fill="#10b981"/>
    <text x="30" y="18.5" fill="#7dd3fc" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.9">ANTIGRAVITY.GOOGLE.COM</text>

    <!-- Main Headline -->
    <text x="0" y="76" fill="#f8fafc" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2">Antigravity Usage Monitor</text>

    <!-- Gradient Accent Sub-headline -->
    <text x="0" y="114" fill="url(#accentText)" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="21" font-weight="600" letter-spacing="-0.2">Real-time model quotas, reset countdowns &amp; credits — right inside the web portal.</text>

    <!-- Feature Chips -->
    <g transform="translate(0, 140)" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="12.5" font-weight="600">
      <rect x="0" y="0" width="174" height="30" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155"/>
      <text x="87" y="19.5" text-anchor="middle" fill="#e2e8f0">Chrome Ext (Tested)</text>

      <rect x="186" y="0" width="166" height="30" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155"/>
      <text x="269" y="19.5" text-anchor="middle" fill="#94a3b8">Userscript (Untested)</text>

      <rect x="364" y="0" width="154" height="30" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155"/>
      <text x="441" y="19.5" text-anchor="middle" fill="#e2e8f0">Zero Local Setup</text>

      <rect x="530" y="0" width="160" height="30" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155"/>
      <text x="610" y="19.5" text-anchor="middle" fill="#e2e8f0">100% Client-Side</text>
    </g>
  </g>
</svg>
