    <text x="136" y="21" fill="#94a3b8" font-size="11" font-weight="500">↻ 1h 18m</text>
    <rect x="198" y="8" width="36" height="18" rx="5" fill="#064e3b" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="216" y="20.5" text-anchor="middle" fill="#34d399" font-size="9.5" font-weight="800">LIVE</text>
