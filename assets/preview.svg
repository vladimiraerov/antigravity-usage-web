      <line x1="10" y1="73" x2="364" y2="73" stroke="#334155" stroke-dasharray="3 3" stroke-opacity="0.5"/>
      <rect x="10" y="78" width="46" height="15" rx="4" fill="#261b47" stroke="#a78bfa" stroke-opacity="0.45"/>
      <text x="33" y="89" text-anchor="middle" fill="#c4b5fd" font-size="9" font-weight="800">WEEKLY</text>
      <text x="364" y="89" text-anchor="end" fill="#34d399" font-size="11" font-weight="700">72% left</text>
