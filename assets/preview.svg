      <text x="23" y="42" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="800">5H</text>
      <text x="364" y="42" text-anchor="end" fill="#fbbf24" font-size="11" font-weight="700">26% left</text>
      <rect x="10" y="50" width="354" height="6" rx="3" fill="#0b1120"/>
      <rect x="10" y="50" width="92" height="6" rx="3" fill="url(#barWarn)"/>
