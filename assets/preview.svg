  <!-- Floating Status Pill (Bottom-Right) -->
  <g transform="translate(648, 398)" filter="url(#shadow)" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
    <rect x="0" y="0" width="246" height="34" rx="17" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <circle cx="18" cy="17" r="4.5" fill="#f59e0b"/>
