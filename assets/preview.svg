    <circle cx="46" cy="42" r="5" fill="#475569"/>
    <circle cx="64" cy="42" r="5" fill="#475569"/>
    <circle cx="82" cy="42" r="5" fill="#475569"/>
    <text x="108" y="46" fill="#64748b" font-size="12" font-weight="600">https://antigravity.google.com</text>

    <rect x="26" y="78" width="435" height="84" rx="12" fill="#131c31" stroke="#1e293b"/>
    <rect x="46" y="98" width="160" height="10" rx="5" fill="#334155"/>
    <rect x="46" y="118" width="340" height="8" rx="4" fill="#1e293b"/>
    <rect x="46" y="134" width="280" height="8" rx="4" fill="#1e293b"/>

    <rect x="26" y="178" width="435" height="130" rx="12" fill="#131c31" stroke="#1e293b"/>
    <rect x="46" y="198" width="190" height="10" rx="5" fill="#334155"/>
    <rect x="46" y="218" width="380" height="8" rx="4" fill="#1e293b"/>
    <rect x="46" y="236" width="350" height="8" rx="4" fill="#1e293b"/>
    <rect x="46" y="254" width="300" height="8" rx="4" fill="#1e293b"/>
    <rect x="46" y="272" width="240" height="8" rx="4" fill="#1e293b"/>

