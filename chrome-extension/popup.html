<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Antigravity Usage Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      background: #0d1322;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .title {
      font-size: 13.5px;
      font-weight: 700;
      color: #f8fafc;
    }
    .open-btn {
      background: rgba(56, 189, 248, 0.16);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #7dd3fc;
      border-radius: 7px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .open-btn:hover { background: rgba(56, 189, 248, 0.28); }
    .meta {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 360px;
      overflow-y: auto;
    }
    .card {
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 10px;
      padding: 9px 10px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      gap: 8px;
    }
    .label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .healthy { color: #34d399; }
    .warning { color: #fbbf24; }
    .critical { color: #f87171; }
    .track {
      height: 6px;
      border-radius: 99px;
      background: #0f172a;
      overflow: hidden;
      margin-bottom: 5px;
    }
    .fill { height: 100%; border-radius: 99px; }
    .fill.healthy { background: linear-gradient(90deg, #10b981, #38bdf8); }
    .fill.warning { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
    .fill.critical { background: linear-gradient(90deg, #ef4444, #fb7185); }
    .sub {
      font-size: 10.5px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }
    .empty {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
      padding: 18px 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Antigravity Usage Monitor</div>
    <a class="open-btn" href="https://antigravity.google.com" target="_blank" rel="noreferrer">Open Portal ↗</a>
  </div>
  <div id="content"></div>
  <script src="popup.js"></script>
</body>
</html>
